name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Download Zig compiler
      run: |
        $ZIG_URL = "https://ziglang.org/download/0.11.0/zig-windows-x86_64-0.11.0.zip"
        Invoke-WebRequest -Uri $ZIG_URL -OutFile "zig.zip"
        Expand-Archive -Path "zig.zip" -DestinationPath "." -Force
        
    - name: Build executable
      run: |
        $env:PATH = ".;$env:PATH"
        .\build.bat
        
    - name: Create release archive
      run: |
        Compress-Archive -Path sysoverlay-c.exe, LICENSE, README.md -DestinationPath "sys-overlay-c.zip" -Force
        
    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v1
      with:
        files: sys-overlay-c.zip
        generate_release_notes: true
        draft: false
        prerelease: false
